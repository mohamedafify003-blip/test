<title>Atheen Creative Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Atheen Creative Studio — marketing, advertising, branding and media production.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap">
<script>
(function(){var d=document.documentElement,t=null,l=null;
try{t=localStorage.getItem('atheen-theme');l=localStorage.getItem('atheen-lang');}catch(e){}
if(t==='dark'||t==='light')d.setAttribute('data-theme',t);
if(l!=='ar'&&l!=='en')l='ar';
d.lang=l;d.dir=l==='ar'?'rtl':'ltr';d.classList.add('js');})();
</script>
<style>
/* Layout concept: loud poster blocks — chunky outlines, hard offset shadows, tilted tape strips,
   rotating highlight words and floating shapes. Atheen red does the shouting.
   The dashboard (#admin) reuses the same blocks, calmer. */
:root{
  --red:#FF0000;--k:#101010;--w:#FFFFFF;
  --bg:#FFFFFF;--bg2:#F5F5F5;--ink:#101010;--paper:#FFFFFF;--line:#101010;--shadow:#101010;--muted:#4F4F4F;--ok:#0A7A3B;
  --f-en:"Montserrat",system-ui,sans-serif;--f-ar-d:"Lalezar","Cairo",sans-serif;--f-ar:"Cairo","Segoe UI",Tahoma,sans-serif;
  --f-d:var(--f-en);--f-b:var(--f-en);
  --bw:3px;--gut:max(20px,env(safe-area-inset-left,0px));--gut-r:max(20px,env(safe-area-inset-right,0px));
  --pop:cubic-bezier(.34,1.56,.64,1);--io:cubic-bezier(.76,0,.24,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101010;--bg2:#1A1A1A;--ink:#FFFFFF;--paper:#1A1A1A;--line:#FFFFFF;--shadow:#FF0000;--muted:#BDBDBD;--ok:#4ADE80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101010;--bg2:#1A1A1A;--ink:#FFFFFF;--paper:#1A1A1A;--line:#FFFFFF;--shadow:#FF0000;--muted:#BDBDBD;--ok:#4ADE80;color-scheme:dark}
html[lang="ar"]{--f-d:var(--f-ar-d);--f-b:var(--f-ar)}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:1.0625rem;line-height:1.7;overflow-x:hidden;transition:background-color .5s,color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
::selection{background:var(--red);color:var(--k)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:6px}
.wrap{max-width:1300px;margin-inline:auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.dsp{font-family:var(--f-d);font-weight:900;letter-spacing:-.035em;line-height:1.02}
html[lang="ar"] .dsp{font-weight:400;letter-spacing:0;line-height:1.25}
.sec{padding-block:clamp(5rem,10vw,8.5rem);position:relative;overflow:hidden}
.h2{font-size:clamp(2.4rem,6.2vw,5.6rem)}
.lead{font-size:clamp(1.05rem,1.6vw,1.3rem);max-width:40rem;margin-top:1.2rem}
.hl{display:inline-block;background:var(--red);color:var(--k);padding:0 .28em;border-radius:.28em;transform:rotate(-2deg);margin-block:.06em}
.hl.ink{background:var(--k);color:var(--red)}
.hl.r2{transform:rotate(2deg)}
.chip{display:inline-flex;align-items:center;gap:.6rem;border:var(--bw) solid currentColor;border-radius:999px;padding:.35rem 1.1rem;font-weight:700;font-size:.95rem}
.dot{width:11px;height:11px;border-radius:50%;background:var(--red);flex:none}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-16px) rotate(5deg)}}
.spin{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.4rem;padding:.8rem 1.9rem;border-radius:18px;border:var(--bw) solid var(--line);
  font-weight:800;font-size:1.1rem;white-space:nowrap;box-shadow:6px 6px 0 var(--shadow);transition:transform .18s var(--pop),box-shadow .18s var(--pop)}
.btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--shadow)}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--shadow)}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn-red{background:var(--red);color:var(--k)}
.btn-ghost{background:transparent}
.btn-ink{background:var(--k);color:#fff;border-color:var(--k);box-shadow:6px 6px 0 #fff}
.btn-ink:hover{box-shadow:9px 9px 0 #fff}
.btn svg{width:1.15em;height:1.15em}
html[dir="rtl"] .btn svg.arr{transform:scaleX(-1)}

.curtain{position:fixed;inset:0;z-index:90;pointer-events:none;display:grid}
.curtain i{grid-area:1/1;transform:scaleY(0);transform-origin:bottom}
.curtain i:nth-child(1){background:var(--red)}.curtain i:nth-child(2){background:var(--k)}
.curtain.in i{animation:cIn .5s var(--io) forwards}.curtain.in i:nth-child(2){animation-delay:.07s}
.curtain.out i{transform:scaleY(1);transform-origin:top;animation:cOut .55s var(--io) forwards}.curtain.out i:nth-child(1){animation-delay:.07s}
@keyframes cIn{to{transform:scaleY(1)}}@keyframes cOut{to{transform:scaleY(0)}}
.cursor{position:fixed;top:0;left:0;z-index:95;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--red);border:2px solid var(--k);pointer-events:none;opacity:0;transition:width .3s var(--pop),height .3s var(--pop),margin .3s var(--pop),opacity .3s}
.has-cursor .cursor{opacity:1}
.cursor.big{width:54px;height:54px;margin:-27px 0 0 -27px;background:transparent;border-color:var(--red);border-width:3px}
.in-admin .cursor{display:none}
@media (hover:none),(pointer:coarse){.cursor{display:none}}

.nav{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:transform .5s var(--io),background-color .4s,border-color .4s;border-bottom:var(--bw) solid transparent}
.nav.scrolled,.in-admin .nav{background:var(--bg);border-bottom-color:var(--line)}
.nav.hide{transform:translateY(-115%)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:5rem}
.logo{display:block;width:clamp(140px,12vw,178px);color:var(--ink)}
.logo:hover svg{animation:wig .5s ease}
@keyframes wig{25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
.links{display:flex;gap:clamp(.8rem,1.6vw,1.6rem);list-style:none;margin:0;padding:0;font-weight:700;font-size:.98rem}
.links a{padding:.3rem .1rem;border-bottom:3px solid transparent;transition:border-color .2s}
.links a:hover,.links a[aria-current="page"]{border-bottom-color:var(--red)}
.acts{display:flex;align-items:center;gap:.55rem}
.ib{height:2.9rem;min-width:2.9rem;padding-inline:.8rem;border:var(--bw) solid var(--line);border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--bg);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);transition:transform .15s var(--pop),box-shadow .15s}
.ib:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shadow)}
.ib svg{width:20px;height:20px}
#langBtn{font-family:var(--f-ar)}
html[lang="ar"] #langBtn{font-family:var(--f-en)}
.sun{display:none}.is-dark .sun{display:block}.is-dark .moon{display:none}
.nav .btn{min-height:2.9rem;padding:.4rem 1.2rem;font-size:.98rem;border-radius:14px;box-shadow:3px 3px 0 var(--shadow)}
.burger{display:none}
@media (max-width:1180px){.links,.nav .btn{display:none}.burger{display:grid}}
.menu{position:fixed;inset:0;z-index:45;background:var(--red);color:var(--k);display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(6.5rem + env(safe-area-inset-top,0px)) var(--gut-r) calc(2rem + env(safe-area-inset-bottom,0px)) var(--gut);
  clip-path:circle(0% at var(--mx,90%) 2.5rem);visibility:hidden;transition:clip-path .7s var(--io),visibility 0s .7s}
.menu-open .menu{clip-path:circle(150% at var(--mx,90%) 2.5rem);visibility:visible;transition:clip-path .7s var(--io)}
.menu ol{list-style:none;margin:0;padding:0;display:grid;gap:.2rem}
.menu a{display:inline-block;font-size:clamp(2.3rem,10vw,3.8rem);transform:translateY(30px) rotate(3deg);opacity:0;transition:transform .6s var(--pop),opacity .4s}
.menu-open .menu a{transform:none;opacity:1}
.menu a[aria-current="page"]{background:var(--k);color:var(--red);padding-inline:.25em;border-radius:.2em}
.menu .btn{align-self:flex-start}

.hero{padding-top:calc(7.5rem + env(safe-area-inset-top,0px));padding-bottom:clamp(5rem,8vw,7rem);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr);gap:2rem;align-items:center;position:relative;z-index:2}
.hero h1{font-size:clamp(3rem,7.4vw,7.2rem);margin-top:1.6rem}
html[lang="ar"] .hero h1{font-size:clamp(3.2rem,8.4vw,8.4rem);line-height:1.18}
.rot{display:inline-grid;vertical-align:bottom;overflow:hidden;padding-inline:.3em}
.rot span{grid-area:1/1;transition:transform .55s var(--pop),opacity .3s}
.rot span.out{transform:translateY(-110%) rotate(-6deg);opacity:0}
.rot span.wait{transform:translateY(110%) rotate(6deg);opacity:0}
.hero-desc{font-size:clamp(1.05rem,1.55vw,1.35rem);max-width:38rem;margin-top:1.8rem;line-height:1.8}
.hero-cta{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2.4rem}
.shape{position:absolute;pointer-events:none;z-index:1}
.s-circle{width:clamp(80px,9vw,130px);aspect-ratio:1;border-radius:50%;background:var(--red);border:var(--bw) solid var(--line)}
.s-star{width:clamp(60px,6vw,90px);aspect-ratio:1}
.s-star i{position:absolute;inset:0;background:var(--ink)}
.s-star i+i{transform:rotate(45deg)}
.s-big{width:clamp(240px,28vw,380px);aspect-ratio:1;border-radius:50%;background:var(--red)}
.s-ring{width:70px;aspect-ratio:1;border-radius:50%;border:12px solid var(--ink)}
.s-sq{width:46px;aspect-ratio:1;border-radius:10px;background:var(--ink)}

.cube-wrap{display:grid;justify-items:center;gap:1.6rem;position:relative}
.scene{width:var(--c);height:var(--c);perspective:1100px;--c:clamp(190px,22vw,300px);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.scene.grab{cursor:grabbing}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;display:grid;place-items:center;border:4px solid var(--k);border-radius:22px;font-family:var(--f-d);font-weight:900;font-size:calc(var(--c) * .16);color:var(--k);backface-visibility:hidden;overflow:hidden;letter-spacing:-.03em}
html[lang="ar"] .face{font-weight:400;letter-spacing:0;font-size:calc(var(--c) * .2)}
.face span{position:relative;z-index:1;padding:.1em .3em}
.f1{background:var(--red);transform:translateZ(calc(var(--c)/2))}
.f2{background:#fff;transform:rotateY(90deg) translateZ(calc(var(--c)/2));background-image:radial-gradient(var(--k) 2px,transparent 2.2px);background-size:18px 18px}
.f2 span{background:#fff;border:3px solid var(--k);border-radius:14px}
.f3{background:var(--k);color:var(--red);transform:rotateY(180deg) translateZ(calc(var(--c)/2))}
.f4{background:var(--red);transform:rotateY(-90deg) translateZ(calc(var(--c)/2));background-image:repeating-linear-gradient(45deg,rgba(16,16,16,.16) 0 12px,transparent 12px 24px)}
.f5{background:#fff;transform:rotateX(90deg) translateZ(calc(var(--c)/2))}
.f5::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--red);border:4px solid var(--k)}
.f6{background:var(--k);color:#fff;transform:rotateX(-90deg) translateZ(calc(var(--c)/2))}
.f6::before{content:"";position:absolute;width:55%;aspect-ratio:1;border:14px solid var(--red);border-radius:50%}
.cube-shadow{width:calc(var(--c) * .8);height:22px;border-radius:50%;background:var(--ink);opacity:.18;filter:blur(6px)}
.cube-hint{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;font-size:.9rem;border:var(--bw) solid var(--line);border-radius:999px;padding:.3rem .95rem;background:var(--bg);transform:rotate(-3deg)}
.cube-hint svg{width:18px;height:18px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.cube-wrap{order:-1;margin-top:.5rem}.scene{--c:150px}.cube-shadow,.cube-hint{display:none}.hero h1{margin-top:1rem}}

.tape{position:relative;z-index:3;background:var(--red);color:var(--k);border-block:4px solid var(--k);overflow:hidden;transform:rotate(-1.4deg);margin:-1.4rem -2rem 0;direction:ltr}
.tape.ink{background:var(--k);color:#fff;transform:rotate(1.2deg);margin-top:0}
.mq{display:flex;width:max-content;animation:mq 32s linear infinite}
.tape.ink .mq{animation-direction:reverse}
.tape:hover .mq{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq div{display:flex;align-items:center;padding-block:1.05rem}
html[dir="rtl"] .mq div{direction:rtl}
.mq span{font-family:var(--f-d);font-weight:900;font-size:clamp(1.8rem,3.6vw,3rem);line-height:1;white-space:nowrap;text-transform:uppercase;letter-spacing:-.02em}
html[lang="ar"] .mq span{font-weight:400;letter-spacing:0;line-height:1.3}
.mq i{display:inline-block;width:20px;height:20px;background:currentColor;transform:rotate(45deg);margin-inline:2rem;flex:none}
.tape.ink .mq i{background:var(--red)}

.box{position:relative;border:var(--bw) solid var(--line);border-radius:26px;box-shadow:8px 8px 0 var(--shadow);overflow:hidden;isolation:isolate;transition:transform .22s var(--pop),box-shadow .22s var(--pop)}
a.box:hover,.box.hov:hover{transform:translate(-4px,-4px) rotate(-1.2deg);box-shadow:14px 14px 0 var(--shadow)}
.c-red{background:var(--red);color:var(--k)}
.c-paper{background:var(--paper);color:var(--ink)}
.c-dots{background-color:var(--paper);background-image:radial-gradient(var(--ink) 1.6px,transparent 1.8px);background-size:16px 16px;color:var(--ink)}
.c-inv{background:var(--ink);color:var(--bg)}
.c-stripe{background-color:var(--red);background-image:repeating-linear-gradient(45deg,rgba(16,16,16,.13) 0 14px,transparent 14px 28px);color:var(--k)}
.c-ink{background:var(--k);color:#fff}
.num{align-self:flex-start;font-family:var(--f-en);font-weight:900;font-size:1.4rem;border:var(--bw) solid currentColor;border-radius:999px;padding:.05rem 1rem}
.c-dots .num,.c-dots h3,.c-dots .lbl{background:var(--paper)}
.deco{position:absolute;z-index:-1;pointer-events:none}

.about{background:var(--bg2)}
.about-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(2rem,5vw,4rem);align-items:center}
.about p.body{font-size:clamp(1.05rem,1.4vw,1.2rem);max-width:40rem;margin-top:1.3rem}
.name-card{padding:2rem;display:grid;gap:1rem;transform:rotate(2deg)}
.name-card h3{font-family:var(--f-d);font-weight:900;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.15;justify-self:start;padding-inline:.2em}
.name-card p{background:var(--paper);padding:.6rem .8rem;border-radius:12px}
html[lang="ar"] .name-card h3{font-weight:400}
.textlink{display:inline-flex;align-items:center;gap:.5rem;font-weight:800;border-bottom:3px solid var(--red);padding-bottom:.15rem;margin-top:1.8rem}
.textlink svg{width:1.1em;height:1.1em}
html[dir="rtl"] .textlink svg{transform:scaleX(-1)}
@media (max-width:900px){.about-grid{grid-template-columns:1fr}.name-card{transform:rotate(-1deg)}}

.svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:3.5rem}
.svc{min-height:20rem;padding:1.8rem;display:flex;flex-direction:column;justify-content:space-between;gap:1.4rem}
.svc h3{font-family:var(--f-d);font-weight:900;font-size:clamp(1.6rem,2.4vw,2.2rem);line-height:1.1;margin-bottom:.6rem;letter-spacing:-.02em}
html[lang="ar"] .svc h3{font-weight:400;letter-spacing:0;line-height:1.3;font-size:clamp(1.9rem,2.7vw,2.5rem)}
.svc p{font-size:1.02rem;line-height:1.7}
.c-dots.svc p{background:var(--paper);border-radius:10px;padding:.3rem .5rem;margin-inline:-.5rem}
.svc .go{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.95rem;margin-top:1rem;border-bottom:3px solid currentColor}
.svc .go svg{width:1em;height:1em}
html[dir="rtl"] .svc .go svg{transform:scaleX(-1)}
@media (max-width:1050px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.svc-grid{grid-template-columns:1fr}.svc{min-height:0}}

.reel{background:var(--red);color:var(--k)}
.reel-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:clamp(2rem,5vw,4rem);align-items:center}
.reel .eyebrow{font-family:var(--f-en);font-weight:900;font-size:1.4rem;letter-spacing:.06em;margin-bottom:.8rem}
.film{background:var(--k);border:4px solid var(--k);border-radius:28px;padding:16px;box-shadow:12px 12px 0 #fff;transform:rotate(1.6deg)}
.perf{height:12px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 40px);border-radius:3px}
.screen{position:relative;aspect-ratio:16/9;border-radius:16px;background:#fff;margin-block:14px;display:grid;place-items:center;overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:2}
.screen .deco{z-index:0}
.play{position:relative;z-index:1;width:104px;height:104px;border-radius:50%;background:var(--red);border:4px solid var(--k);display:grid;place-items:center;transition:transform .25s var(--pop)}
.play:hover{transform:scale(1.1) rotate(-6deg)}
.play svg{width:40px;height:40px;margin-left:6px}
.rec{position:absolute;z-index:3;top:14px;right:16px;display:flex;align-items:center;gap:.5rem;background:var(--k);color:#fff;border-radius:999px;padding:.2rem .9rem;font-weight:800;font-size:.85rem;font-family:var(--f-en)}
.reel-note{text-align:center;font-weight:700;margin-top:1.1rem}
@media (max-width:900px){.reel-grid{grid-template-columns:1fr}}

.work{background:var(--k);color:#fff}
.work-head{display:flex;justify-content:space-between;align-items:end;gap:1.5rem;flex-wrap:wrap}
.work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:3.5rem}
.wcard{min-height:23rem;padding:1.8rem;display:flex;flex-direction:column;justify-content:space-between;border-color:#fff!important;box-shadow:8px 8px 0 var(--red)}
.wcard:hover{box-shadow:14px 14px 0 var(--red)!important}
.wmedia{position:absolute;inset:0;z-index:-1}
.wmedia img,.wmedia video{width:100%;height:100%;object-fit:cover;display:block}
.wmedia video{position:absolute;inset:0;opacity:0;transition:opacity .3s}
.wcard:hover .wmedia video{opacity:1}
.wmedia::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(16,16,16,.85),rgba(16,16,16,0) 60%)}
.wcard.has-media{color:#fff}
.tag{align-self:flex-start;background:var(--k);color:#fff;border-radius:999px;padding:.3rem 1.1rem;font-weight:800;font-size:.95rem;border:2px solid #fff}
.c-inv .tag,.c-ink .tag{background:var(--red);color:var(--k);border-color:var(--k)}
.wcard h3{font-family:var(--f-d);font-weight:900;font-size:clamp(2rem,3.6vw,3.3rem);line-height:1.05}
html[lang="ar"] .wcard h3{font-weight:400}
.wcard p{font-weight:700;margin-top:.4rem}
.work .c-dots{--paper:#fff;--ink:#101010;color:#101010}
.work .c-dots:not(.has-media) h3,.work .c-dots:not(.has-media) p{background:#fff;display:inline-block;padding-inline:.25em;border-radius:8px}
.work .c-inv{background:#fff;color:#101010}
.note{display:flex;gap:.7rem;align-items:flex-start;margin-top:2.6rem;font-size:.98rem;opacity:.85;max-width:44rem}
.note .dot{margin-top:.55em}
.work .btn-ghost{color:#fff;border-color:#fff;box-shadow:6px 6px 0 var(--red)}
@media (max-width:800px){.work-grid{grid-template-columns:1fr}}

.why{background:var(--bg2)}
.why-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.5rem 2rem;margin-top:3.5rem}
.why-n{font-family:var(--f-en);font-weight:900;font-size:clamp(5rem,9vw,8.5rem);line-height:1;color:transparent;-webkit-text-stroke:3px var(--ink);transition:transform .3s var(--pop),color .3s;display:inline-block}
.why-i:nth-child(even) .why-n{-webkit-text-stroke-color:var(--red)}
.why-i:hover .why-n{transform:rotate(-6deg) scale(1.06);color:var(--red);-webkit-text-stroke-color:var(--red)}
.why-i h3{font-family:var(--f-d);font-weight:900;font-size:clamp(1.5rem,2.2vw,2.1rem);line-height:1.15;margin:.4rem 0 .5rem}
html[lang="ar"] .why-i h3{font-weight:400}
.why-i p{color:var(--muted);font-size:1rem}
@media (max-width:1000px){.why-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.why-grid{grid-template-columns:1fr}}

.logos{display:flex;width:max-content;gap:20px;animation:mq 34s linear infinite;padding-block:14px}
html[dir="rtl"] .logos{animation-direction:reverse}
.logos-wrap{overflow:hidden;margin-top:3rem}
.logos-wrap:hover .logos,.logos-wrap.paused .logos{animation-play-state:paused}
.lslot{flex:none;width:210px;height:104px;display:grid;place-items:center;border:var(--bw) dashed var(--line);border-radius:22px;font-weight:800;color:var(--muted);transform:rotate(var(--r,0deg));background:var(--bg);transition:transform .2s var(--pop);overflow:hidden;padding:14px}
.lslot.real{border-style:solid;background:#fff}
.lslot img{max-width:100%;max-height:100%;object-fit:contain}
.lslot:hover{transform:rotate(0) scale(1.05);border-style:solid;color:var(--ink)}
.pctl{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:1.4rem;color:var(--muted);font-size:.98rem}
.pctl .ib{font-size:.85rem;padding-inline:1rem}

.cta{background:var(--red);color:var(--k);text-align:center;border-top:4px solid var(--k)}
.cta h2{font-size:clamp(2.8rem,8vw,7.6rem)}
.cta .lead{margin-inline:auto}
.cta .btn{margin-top:2.4rem;font-size:1.25rem;min-height:4rem;padding-inline:2.6rem}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;margin-top:2.8rem}
.pills span,.pills a{border:var(--bw) solid var(--k);border-radius:999px;padding:.45rem 1.3rem;font-weight:800;user-select:all}

.footer{background:var(--k);color:#fff;padding-block:4rem calc(2rem + env(safe-area-inset-bottom,0px))}
.in-admin .footer{display:none}
.ft{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:2.5rem}
.ft .logo{color:#fff;width:200px}
.ft-tag{font-family:var(--f-d);font-weight:900;font-size:clamp(1.4rem,2.2vw,1.9rem);line-height:1.2;margin-top:1.5rem;max-width:18ch}
html[lang="ar"] .ft-tag{font-weight:400;line-height:1.45}
.ft-desc{opacity:.75;margin-top:.8rem;font-size:.95rem;max-width:36ch}
.ft h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--red);margin-bottom:1rem;font-weight:800}
html[lang="ar"] .ft h3{letter-spacing:0;font-size:1rem}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;font-size:.95rem}
.ft ul a:hover{color:var(--red)}
.soc{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.soc a{border:2px solid #fff;border-radius:999px;padding:.25rem .85rem;font-size:.85rem;font-weight:700;transition:background-color .2s,color .2s,border-color .2s}
.soc a:hover{background:var(--red);border-color:var(--red);color:var(--k)}
.fb{margin-top:3rem;padding-top:1.4rem;border-top:2px solid rgba(255,255,255,.2);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.88rem;opacity:.8}
@media (max-width:900px){.ft{grid-template-columns:repeat(2,minmax(0,1fr))}.ft>div:first-child{grid-column:1/-1}}
@media (max-width:520px){.ft{grid-template-columns:1fr}}

.view[hidden]{display:none!important}
.stub{min-height:100svh;padding-top:calc(9rem + env(safe-area-inset-top,0px));padding-bottom:5rem;position:relative;overflow:hidden}
.stub h1{font-size:clamp(2.6rem,7vw,6.4rem);max-width:16ch;margin-top:1.4rem}
.plan{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2.2rem;list-style:none;padding:0}
.plan li{border:var(--bw) solid var(--line);border-radius:999px;padding:.4rem 1.1rem;font-weight:700;background:var(--bg);box-shadow:3px 3px 0 var(--shadow)}
.plan li:nth-child(3n+1){transform:rotate(-1.5deg)}.plan li:nth-child(3n){transform:rotate(1.5deg)}
.stub-note{margin-top:2.4rem;padding:1.2rem 1.4rem;max-width:44rem;font-weight:600}
.stub-cta{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2.4rem}
.xsec{margin-top:4.5rem}
.xsec h2{font-size:clamp(2rem,4.4vw,3.6rem);margin-bottom:2rem}
.empty{border:var(--bw) dashed var(--line);border-radius:22px;padding:1.6rem;font-weight:600;color:var(--muted);max-width:46rem}

/* Team */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px}
.tm{display:flex;flex-direction:column;background:var(--paper)}
.tm-ph{aspect-ratio:4/5;overflow:hidden;border-bottom:var(--bw) solid var(--line);background:var(--bg2)}
.tm-ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transform:scale(1.02);transition:filter .5s,transform .6s var(--pop)}
.tm:hover .tm-ph img{filter:none;transform:scale(1.08)}
.tm-b{padding:1rem 1.1rem;display:grid;gap:.3rem}
.tm-b h3{font-family:var(--f-d);font-weight:900;font-size:1.35rem;line-height:1.15}
html[lang="ar"] .tm-b h3{font-weight:400;font-size:1.6rem}
.tm-b .role{color:var(--red);font-weight:800;font-size:.95rem}
.tm-b details{font-size:.95rem;color:var(--muted)}
.tm-b summary{cursor:pointer;font-weight:700;color:var(--ink)}
.tm-b a{font-weight:800;font-size:.9rem;text-decoration:underline;text-underline-offset:4px}

/* Jobs */
.jobs{display:grid;gap:20px}
.job{padding:1.4rem 1.6rem;display:grid;gap:.7rem;background:var(--paper)}
.job-top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.job h3{font-family:var(--f-d);font-weight:900;font-size:1.6rem;line-height:1.15}
html[lang="ar"] .job h3{font-weight:400;font-size:1.9rem}
.meta{display:flex;flex-wrap:wrap;gap:.5rem}
.meta span{border:2px solid var(--line);border-radius:999px;padding:.1rem .8rem;font-size:.85rem;font-weight:700}
.job details{color:var(--muted)}
.job summary{cursor:pointer;font-weight:800;color:var(--ink)}
.job .pre{white-space:pre-line}

/* Site forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;max-width:52rem;padding:clamp(1.4rem,3vw,2.2rem);background:var(--paper)}
.f{display:grid;gap:.35rem;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-weight:800;font-size:.95rem}
.f input,.f select,.f textarea{font:inherit;color:var(--ink);background:var(--bg);border:var(--bw) solid var(--line);border-radius:14px;padding:.7rem .9rem;width:100%;min-width:0;transition:box-shadow .15s,transform .15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;box-shadow:4px 4px 0 var(--red);transform:translate(-2px,-2px)}
.f textarea{min-height:8rem;resize:vertical}
.f .hint{font-size:.85rem;color:var(--muted)}
.hp{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.form .btn{justify-self:start}
.fmsg{grid-column:1/-1;font-weight:800;padding:.8rem 1rem;border-radius:12px;border:var(--bw) solid currentColor}
.fmsg.ok{color:var(--ok)}.fmsg.err{color:var(--red)}
.cinfo{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:2rem}
.cinfo span,.cinfo a{border:var(--bw) solid var(--line);border-radius:999px;padding:.45rem 1.2rem;font-weight:800;background:var(--bg);box-shadow:3px 3px 0 var(--shadow)}
@media (max-width:640px){.form{grid-template-columns:1fr}}

.rv{transition:transform .8s var(--pop),opacity .5s ease}
.rv.pre{opacity:0;transform:translateY(50px) rotate(2deg) scale(.96)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:96;overflow:hidden}
.confetti i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--red)}
.confetti i.c{border-radius:50%}.confetti i.k{background:var(--ink)}

/* ================= Dashboard ================= */
.fab{position:fixed;z-index:55;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:calc(18px + env(safe-area-inset-left,0px));display:inline-flex;align-items:center;gap:.5rem;
  background:var(--k);color:#fff;border:3px solid #fff;border-radius:16px;padding:.6rem 1.1rem;font-weight:800;font-family:var(--f-ar);box-shadow:4px 4px 0 var(--red)}
.fab[hidden],.in-admin .fab{display:none}
.admin{min-height:100svh;padding-top:calc(6.5rem + env(safe-area-inset-top,0px));padding-bottom:4rem;background:var(--bg2);font-family:var(--f-ar)}
.admin [dir="ltr"]{font-family:var(--f-en)}
.adm-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.8rem}
.adm-head h1{font-family:var(--f-ar-d);font-weight:400;font-size:clamp(2rem,4vw,3rem);line-height:1.2}
.adm-head p{color:var(--muted);font-size:.95rem}
.adm-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.adm-side{position:sticky;top:6.5rem;display:grid;gap:8px}
.adm-side button{display:flex;justify-content:space-between;align-items:center;gap:.5rem;text-align:start;padding:.65rem 1rem;border:var(--bw) solid var(--line);border-radius:14px;background:var(--bg);font-weight:800;box-shadow:3px 3px 0 var(--shadow);transition:transform .15s var(--pop)}
.adm-side button:hover{transform:translate(-2px,-2px)}
.adm-side button[aria-current="true"]{background:var(--red);color:var(--k)}
.badge{min-width:1.6rem;height:1.6rem;padding-inline:.4rem;border-radius:999px;background:var(--k);color:#fff;font-size:.8rem;display:inline-grid;place-items:center;font-family:var(--f-en)}
.adm-panel{min-width:0}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.ptitle h2{font-family:var(--f-ar-d);font-weight:400;font-size:2rem;line-height:1.2}
.ptitle p{color:var(--muted);font-size:.95rem;width:100%}
.acard{background:var(--bg);border:var(--bw) solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--shadow);padding:1.3rem;display:grid;gap:1rem;margin-bottom:22px;min-width:0}
.acard.off{opacity:.7}
.acard h3{font-family:var(--f-ar-d);font-weight:400;font-size:1.5rem;line-height:1.2}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld{display:grid;gap:.3rem;min-width:0;align-content:start}
.fld.full{grid-column:1/-1}
.fld>label,.fld>span.l{font-weight:700;font-size:.9rem}
.fld .def{font-size:.8rem;color:var(--muted)}
.fld input[type=text],.fld input[type=url],.fld input[type=email],.fld input[type=tel],.fld textarea,.fld select{font:inherit;font-size:.98rem;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:.55rem .75rem;width:100%;min-width:0}
.fld textarea{min-height:5.5rem;resize:vertical;line-height:1.6}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.chk{display:inline-flex;align-items:center;gap:.5rem;font-weight:700}
.chk input{width:1.2rem;height:1.2rem;accent-color:var(--red)}
.racts{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}
.sb{display:inline-flex;align-items:center;gap:.4rem;min-height:2.5rem;padding:.35rem 1rem;border:2px solid var(--line);border-radius:12px;font-weight:800;font-size:.92rem;background:var(--bg);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);transition:transform .12s}
.sb:hover{transform:translate(-1px,-1px)}
.sb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.sb.red{background:var(--red);color:var(--k);border-color:var(--k)}
.sb.danger{color:var(--red);border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.sb.danger.arm{background:var(--red);color:#fff}
.sb[disabled]{opacity:.5;pointer-events:none}
.sb.sq{min-width:2.5rem;justify-content:center;padding:.35rem}
.media{display:grid;gap:.5rem}
.mprev{aspect-ratio:16/10;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;background:var(--bg2);color:var(--muted);font-size:.9rem;text-align:center;padding:.5rem}
.mprev.logo{aspect-ratio:3/1;background:#fff}
.mprev img,.mprev video{width:100%;height:100%;object-fit:cover;display:block}
.mprev.logo img{object-fit:contain}
.mstat{font-size:.85rem;font-weight:700;color:var(--muted)}
.dirty-dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:none}
.acard.dirty .dirty-dot{display:inline-block}
.secrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1rem;padding:.8rem 1rem;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.secrow b{font-size:1.05rem}
.req{display:grid;gap:.5rem}
.req .rmeta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.85rem;color:var(--muted)}
.req dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.3rem 1rem;margin:0;font-size:.95rem}
.req dt{font-weight:800}
.req dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.st{border-radius:999px;padding:.1rem .7rem;font-weight:800;font-size:.8rem;border:2px solid currentColor}
.st-new{color:var(--red)}.st-contacted{color:#B26B00}.st-done{color:var(--ok)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gate{max-width:40rem;margin:2rem auto;text-align:center}
.toast{position:fixed;z-index:99;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,150%);background:var(--k);color:#fff;border:3px solid #fff;border-radius:14px;padding:.7rem 1.3rem;font-weight:800;font-family:var(--f-ar);box-shadow:4px 4px 0 var(--red);transition:transform .35s var(--pop);max-width:calc(100vw - 40px)}
.toast.on{transform:translate(-50%,0)}
.toast.err{box-shadow:4px 4px 0 #fff;background:var(--red);color:var(--k)}
@media (max-width:900px){.adm-grid{grid-template-columns:1fr}.adm-side{position:static;display:flex;overflow-x:auto;padding-bottom:8px}.adm-side button{white-space:nowrap;flex:none}}
@media (max-width:620px){.fgrid{grid-template-columns:1fr}.req dl{grid-template-columns:1fr}}

/* Social icons + WhatsApp pills */
.soc-ico{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.soc-ico a{width:2.8rem;height:2.8rem;border:2px solid currentColor;border-radius:14px;display:grid;place-items:center;transition:transform .15s var(--pop),background-color .2s,color .2s,border-color .2s}
.soc-ico a:hover{background:var(--red);border-color:var(--red);color:var(--k);transform:rotate(-6deg) scale(1.08)}
.soc-ico a[data-pending]{opacity:.45}
.soc-ico svg{width:20px;height:20px}
.ic{display:inline-flex;align-items:center;gap:.5rem}
.ic svg{width:20px;height:20px;flex:none}
.ft ul .ic svg{width:18px;height:18px;color:var(--red)}
/* Call sheet */
.cs{max-width:62rem;background:var(--paper);border:var(--bw) solid var(--line);border-radius:26px;box-shadow:10px 10px 0 var(--shadow);overflow:hidden;margin-top:3rem}
.cs-top{background:var(--k);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1.3rem 1.6rem}
.cs-top h2{font-family:var(--f-en);font-weight:900;font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.03em;line-height:.95;text-transform:uppercase}
.cs-top .sub{font-family:var(--f-en);font-weight:700;opacity:.8;font-size:.95rem;letter-spacing:.04em;margin-top:.35rem}
.cs-top .r{display:grid;justify-items:end;gap:.5rem}
html[dir="rtl"] .cs-top .r{justify-items:start}
.cs-rec{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--f-en);font-weight:800;border:2px solid #fff;border-radius:999px;padding:.15rem .9rem;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem}
.cs-req{font-size:.85rem;opacity:.85}
.cs-strip{display:flex;gap:1.6rem;flex-wrap:wrap;padding:.55rem 1.6rem;border-block:var(--bw) solid var(--k);font-family:var(--f-en);font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:var(--k);direction:ltr}
.cs-sec{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:1.4rem;padding:1.7rem 1.6rem;border-bottom:2px dashed var(--line)}
.cs-lab{display:grid;align-content:start;gap:.2rem}
.cs-lab b{font-family:var(--f-en);font-weight:900;font-size:2.6rem;line-height:1;color:transparent;-webkit-text-stroke:2px var(--ink)}
.cs-lab span{font-family:var(--f-d);font-weight:900;font-size:1.55rem;line-height:1.15}
html[lang="ar"] .cs-lab span{font-weight:400;font-size:1.9rem}
.cs-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;min-width:0}
.cs .f input,.cs .f textarea{background:var(--bg)}
.opt{font-weight:700;color:var(--muted);font-size:.75rem;border:1.5px solid currentColor;border-radius:999px;padding:0 .5rem;margin-inline-start:.4rem;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:.55rem}
.chips label{cursor:pointer;position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:.35rem 1.05rem;font-weight:700;background:var(--bg);transition:transform .18s var(--pop),background-color .15s,box-shadow .15s}
.chips label:hover span{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}
.chips input:checked+span{background:var(--red);color:var(--k);border-color:var(--k);transform:rotate(-2deg);box-shadow:3px 3px 0 var(--shadow)}
.chips input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.cs-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1.4rem 1.6rem;background:var(--bg2)}
.cs-foot p{font-size:.92rem;color:var(--muted);max-width:30rem}
.cs .fmsg{margin:0 1.6rem 1.6rem}
.fmsg a{text-decoration:underline;text-underline-offset:4px}
@media (max-width:760px){.cs-sec{grid-template-columns:1fr}.cs-fields{grid-template-columns:1fr}}
/* Careers */
.join-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.join{padding:1.5rem;display:grid;gap:.6rem;align-content:start}
.join .jm{width:52px;height:52px}
.join h3{font-family:var(--f-d);font-weight:900;font-size:1.5rem;line-height:1.15}
html[lang="ar"] .join h3{font-weight:400;font-size:1.8rem}
.join p{font-size:1rem}
.tm-ph.ph{display:grid;place-items:center;color:var(--muted);background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(127,127,127,.12) 14px 28px)}
.tm-ph.ph svg{width:38%;height:auto}
.jobs-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.jobs-head h2{margin:0}
/* Apply modal */
.dlg{border:var(--bw) solid var(--line);border-radius:26px;box-shadow:10px 10px 0 var(--red);padding:0;width:min(44rem,calc(100vw - 32px));max-height:calc(100dvh - 32px);background:var(--paper);color:var(--ink);overflow:auto}
.dlg::backdrop{background:rgba(16,16,16,.65)}
.dlg[open]{animation:dlgIn .45s var(--pop)}
@keyframes dlgIn{from{transform:translateY(30px) rotate(2deg) scale(.95);opacity:0}}
.dlg-h{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.4rem;background:var(--red);color:var(--k);border-bottom:var(--bw) solid var(--k)}
.dlg-h h2{font-family:var(--f-d);font-weight:900;font-size:1.8rem;line-height:1.1}
html[lang="ar"] .dlg-h h2{font-weight:400;font-size:2.1rem}
.dlg .form{border:0;box-shadow:none;border-radius:0;max-width:none;background:transparent}

 ar:[
  {id:'who',n:'01',label:'إحنا مين',title:'إحنا مين؟',paras:['أثين بيت إبداعي من الشيخ زايد، متخصص في التسويق والإعلان والإنتاج الإعلامي. تحت سقف واحد عندنا استراتيجيين ومصممين ومصورين وصناع محتوى، عشان براندك ياخد كل اللي محتاجه من مكان واحد وبنفس الروح.','اسمنا جاي من أثينا، رمز الحكمة والاستراتيجية والإبداع. وده بالظبط اللي بنحاول نعمله في كل مشروع: دماغ بتفكر صح، وخيال ملوش سقف.'],chips:['تسويق وإعلان','براندنج وهوية','إنتاج إعلامي','سوشيال ميديا']},

  {id:'values',n:'03',label:'قيمنا',title:'إحنا مؤمنين بإيه',items:[['الإبداع','بندوّر دايمًا على الزاوية اللي محدش بص منها.'],['الابتكار','بنجرب أدوات وطرق جديدة، ومش بنكرر نفسنا.'],['الجودة','كل تفصيلة بتتراجع مرتين قبل ما تطلع.'],['الشراكة','بنشتغل معاك مش عندك، ونجاحك هو نجاحنا.'],['الالتزام','الميعاد ميعاد، والوعد وعد.']]},

/* -- Generic collection editor -- */
function fieldHTML(name,d,f){var key=f[0],label=f[1],type=f[2],ltr=f[3]==='ltr',v=gp(d,key),id='f_'+d.id+'_'+key.replace(/\./g,'_');
  if(type==='bool')return '<div class="fld"><label class="chk"><input type="checkbox" id="'+id+'" data-f="'+key+'"'+(v!==false?' checked':'')+'> '+esc(label)+'</label></div>';
  if(type==='style')return '<div class="fld"><label for="'+id+'">'+esc(label)+'</label><select id="'+id+'" data-f="'+key+'"><option value="">تلقائي</option>'+STYLES.map(function(s){return '<option value="'+s[0]+'"'+(v===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></div>';
  if(type==='cat')return '<div class="fld"><label for="'+id+'">'+esc(label)+'</label><select id="'+id+'" data-f="'+key+'"><option value="">بدون</option>'+CATS.map(function(c){return '<option value="'+c[0]+'"'+(v===c[0]?' selected':'')+'>'+c[1]+'</option>'}).join('')+'</select></div>';
  if(type==='kind')return '<div class="fld"><label for="'+id+'">'+esc(label)+'</label><select id="'+id+'" data-f="'+key+'"><option value="job"'+(v!=='intern'?' selected':'')+'>وظيفة</option><option value="intern"'+(v==='intern'?' selected':'')+'>تدريب</option></select></div>';
  if(type==='image'||type==='video'||type==='logo')return '<div class="fld full">'+mediaField(key,label,type,v).replace('class="fld media"','class="media"')+'</div>';
  if(type==='textarea')return '<div class="fld full"><label for="'+id+'">'+esc(label)+'</label><textarea id="'+id+'" data-f="'+key+'"'+(ltr?' dir="ltr"':'')+'>'+esc(v||'')+'</textarea></div>';
  return '<div class="fld"><label for="'+id+'">'+esc(label)+'</label><input type="'+(type==='url'?'url':'text')+'" id="'+id+'" data-f="'+key+'" value="'+esc(v||'')+'"'+(ltr||type==='url'?' dir="ltr"':'')+'></div>'}
function panelList(p,name){var sc=SCHEMA[name],items=COL[name];
  var seedBtn=(name==='services'&&!items.length)?'<button class="sb" type="button" id="seedSvc">انسخ الخدمات الحالية للّوحة</button>':'';
  p.innerHTML=ptitle(sc.title,sc.hint,'<div class="racts">'+seedBtn+'<button class="sb red" type="button" data-add="'+name+'">'+esc(sc.add)+'</button></div>')+
   (items.length?items.map(function(d,i){return '<div class="acard'+(d.visible===false||d.open===false?' off':'')+'" data-item="'+esc(d.id)+'"><div class="ahead"><h3>'+esc(sc.head(d))+'</h3><span class="racts"><span class="dirty-dot" title="في تعديلات مش محفوظة"></span>'+
     '<button class="sb sq" type="button" data-mv="-1" aria-label="لفوق"'+(i===0?' disabled':'')+'>↑</button><button class="sb sq" type="button" data-mv="1" aria-label="لتحت"'+(i===items.length-1?' disabled':'')+'>↓</button></span></div>'+
     '<div class="fgrid">'+sc.f.map(function(f){return fieldHTML(name,d,f)}).join('')+'</div>'+
     '<div class="racts"><button class="sb red" type="button" data-save>احفظ</button><button class="sb danger" type="button" data-del>امسح</button></div></div>'}).join('')
   :'<div class="acard"><p class="empty" style="max-width:none">لسه مفيش حاجة هنا. دوس "'+esc(sc.add)+'" وابدأ.'+(name==='services'?' الموقع دلوقتي بيعرض الخدمات الأساسية الست، ولو نسختها هنا تقدر تعدّلها.':'')+'</p></div>');
}
function readItem(card,name){var d={};SCHEMA[name].f.forEach(function(f){var key=f[0],type=f[2];
  if(type==='image'||type==='video'||type==='logo'){sp(d,key,readMedia(card,key));return}
  var el=$('[data-f="'+key+'"]',card);if(!el)return;sp(d,key,type==='bool'?el.checked:el.value.trim())});return d}
document.addEventListener('click',async function(e){
  var add=e.target.closest('[data-add]');if(add){var name=add.getAttribute('data-add'),items=COL[name],mx=items.reduce(function(a,x){return Math.max(a,x.order||0)},0);
    var base={order:mx+1,ar:{},en:{},visible:true};if(name==='jobs'){base.kind='job';base.open=true;delete base.visible}if(name==='projects')base.featured=true;
    try{await DB.collection(name).doc().set(base);toast('اتضاف، املا البيانات واحفظ');setTimeout(function(){var cs=$$('#admPanel [data-item]');var last=cs[cs.length-1];if(last){last.scrollIntoView({behavior:'smooth',block:'center'});var f=$('input[type=text]',last);f&&f.focus()}},400)}catch(err){toast(errMsg(err),true)}return}
  var card=e.target.closest('#admPanel [data-item]');if(!card)return;var name2=TAB,id=card.getAttribute('data-item'),items2=COL[name2],idx=items2.findIndex(function(x){return x.id===id}),doc=items2[idx];
  if(e.target.closest('[data-save]')){var d=readItem(card,name2);d.order=doc.order||idx+1;Object.keys(doc).forEach(function(k){if(k!=='id'&&!(k in d)&&k!=='ar'&&k!=='en')d[k]=doc[k]});
    try{await DB.collection(name2).doc(id).set(d);card.classList.remove('dirty');toast('اتحفظ ✓');adminDirty=true;setTimeout(function(){if(!$('#admPanel .acard.dirty'))renderPanel()},50)}catch(err){toast(errMsg(err),true)}}
  var del=e.target.closest('[data-del]');if(del){if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='متأكد؟ دوس تاني';setTimeout(function(){if(del.isConnected){del.classList.remove('arm');del.textContent='امسح'}},3500);return}
    try{await DB.collection(name2).doc(id).delete();toast('اتمسح')}catch(err){toast(errMsg(err),true)}}
  var mv=e.target.closest('[data-mv]');if(mv){var j=idx+(+mv.getAttribute('data-mv')),other=items2[j];if(!other)return;
    var a=doc.order||idx+1,b=other.order||j+1;if(a===b){b=a+(j>idx?1:-1)}
    try{await DB.collection(name2).doc(id).update({order:b});await DB.collection(name2).doc(other.id).update({order:a})}catch(err){toast(errMsg(err),true)}}
});
document.addEventListener('click',async function(e){if(e.target.id!=='seedSvc')return;e.target.disabled=true;
  try{for(var i=0;i<DEF_SERVICES.length;i++){var s=clone(DEF_SERVICES[i]);s.order=i+1;s.visible=true;await DB.collection('services').doc('s'+(i+1)).set(s)}toast('اتنسخت ✓')}catch(err){toast(errMsg(err),true);e.target.disabled=false}});

/* -- Requests inbox -- */
var REQF={leads:'all',applications:'all'};
var STN={new:'جديد',contacted:'اتواصلنا',done:'خلص'};
function panelRequests(p,name){var all=REQ[name],f=REQF[name],list=f==='all'?all:all.filter(function(x){return (x.status||'new')===f});
  var counts={all:all.length,new:0,contacted:0,done:0};all.forEach(function(x){counts[x.status||'new']++});
  var title=name==='leads'?'طلبات العملاء':'طلبات التوظيف',hint=name==='leads'?'كل طلب بيتبعت من فورم "كلمنا" بيوصل هنا.':'كل تقديم من فورم "انضم لفريقنا" بيوصل هنا مع الـ CV.';
  p.innerHTML=ptitle(title,hint)+'<div class="filters">'+[['all','الكل'],['new','جديد'],['contacted','اتواصلنا'],['done','خلص']].map(function(x){return '<button class="sb" type="button" data-rf="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+' ('+counts[x[0]]+')</button>'}).join('')+'</div>'+
  (list.length?list.map(function(r){var rows=name==='leads'?[['الاسم',r.name],['الشركة',r.company],['الإيميل',r.email],['التليفون',r.phone],['نوع المشروع',r.typesLabel],['البريف',r.brief],['التوقيت',r.timing],['الميزانية',r.budget]]
      :[['الاسم',r.name],['الإيميل',r.email],['التليفون',r.phone],['الوظيفة',r.position],['الرسالة',r.message]];
    var cv=r.cv&&r.cv.url?'<a class="sb" href="'+esc(r.cv.url)+'" target="_blank" rel="noopener">افتح الـ CV</a>':'';
    var d=new Date(r.createdAt);var when=isNaN(d)?'':d.toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});
    return '<div class="acard req" data-req="'+esc(r._doc)+'" data-rid="'+esc(r.id)+'"><div class="ahead"><h3>'+esc(r.name||'بدون اسم')+'</h3><span class="st st-'+(r.status||'new')+'">'+STN[r.status||'new']+'</span></div><div class="rmeta"><span>'+esc(when)+'</span><span>'+(r.lang==='en'?'من النسخة الإنجليزي':'من النسخة العربي')+'</span></div>'+
     '<dl>'+rows.filter(function(x){return x[1]}).map(function(x){return '<dt>'+x[0]+'</dt><dd'+(/@|http|^\+?\d/.test(x[1])?' dir="ltr" style="text-align:right"':'')+'>'+esc(x[1])+'</dd>'}).join('')+'</dl>'+
     '<div class="racts">'+cv+'<label class="chk">الحالة: <select data-rst>'+Object.keys(STN).map(function(k){return '<option value="'+k+'"'+((r.status||'new')===k?' selected':'')+'>'+STN[k]+'</option>'}).join('')+'</select></label><button class="sb danger" type="button" data-rdel>امسح</button></div></div>'}).join('')
   :'<div class="acard"><p class="empty" style="max-width:none">'+(all.length?'مفيش طلبات بالحالة دي.':'لسه مفيش طلبات. أول ما حد يبعت من الموقع هيظهر هنا.')+'</p></div>');
}
async function editReq(name,docId,rid,fn){var ref=DB.doc(name+'/'+docId);try{var s=await ref.get();var d=s.exists?s.data():{};var items=(d.items||[]).map(function(x){return clone(x)});items=fn(items);await ref.set({items:items,updatedAt:d.updatedAt||new Date().toISOString()});toast('اتحفظ ✓')}catch(err){toast(errMsg(err),true)}}
document.addEventListener('click',function(e){var f=e.target.closest('[data-rf]');if(f){REQF[TAB]=f.getAttribute('data-rf');renderPanel();return}
  var del=e.target.closest('[data-rdel]');if(del){var c=del.closest('[data-req]');if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='متأكد؟ دوس تاني';setTimeout(function(){if(del.isConnected){del.classList.remove('arm');del.textContent='امسح'}},3500);return}
    var rid=c.getAttribute('data-rid');editReq(TAB,c.getAttribute('data-req'),rid,function(items){return items.filter(function(x){return x.id!==rid})})}});
document.addEventListener('change',function(e){var s=e.target.closest('[data-rst]');if(!s)return;var c=s.closest('[data-req]'),rid=c.getAttribute('data-rid');
  editReq(TAB,c.getAttribute('data-req'),rid,function(items){items.forEach(function(x){if(x.id===rid)x.status=s.value});return items})});

/* ================= Boot ================= */
$('#yr').textContent=new Date().getFullYear();
applyText();syncTheme();show(fromHash(),true);onNav();observe();connect();
})();
</script>
